[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finrag-auditor"
version = "0.1.0"
description = "Grounded financial-document RAG and agentic evaluation system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vishwas Kothari" }]
dependencies = [
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rank-bm25>=0.2.2,<1",
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=3.0,<6",
  "streamlit>=1.49,<2",
  "torch>=2.2,<2.6",
  "transformers>=4.41,<5",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2,<2"]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
finrag = "finrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.coverage.run]
source = ["finrag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
