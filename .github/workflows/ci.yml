name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests run entirely on the named fallbacks; never reach for the Hub in CI.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only torch (avoids multi-GB CUDA wheels)
        run: pip install "torch>=2.2,<2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/finrag
      - run: pytest --cov=finrag --cov-report=term-missing --cov-report=xml
      - name: Import smoke test
        run: python -c "from finrag.agents.graph import FinRAGWorkflow; print('ok')"
      - name: CLI smoke test
        run: finrag --version && python -m finrag --help
      - name: Validate committed frozen manifest digest
        run: |
          python - <<'PY'
          import hashlib, json
          m = json.load(open("data/held_out/test_v2_manifest.json"))
          ids = m["question_ids"]
          digest = hashlib.sha256(("\n".join(ids) + "\n").encode()).hexdigest()
          assert len(ids) == m["sample_size"] == len(set(ids)), "manifest size mismatch"
          assert digest == m["question_ids_sha256"], "manifest digest drift"
          print("frozen manifest ok:", len(ids), "ids")
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finrag-auditor:ci .
      - name: CLI works inside the image
        run: docker run --rm --entrypoint finrag finrag-auditor:ci --version
