extends: base.yaml
data:
  split: dev
  path: data/raw/dev.json
  sample_size: 50
  unanswerable_size: 10
  corpus_scope: selected_reports
generation:
  provider: openai_compatible
  model: openai/gpt-oss-20b
  temperature: 0.0
  max_retries: 2
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
evaluation:
  run_name: groq_dev
  resume: true
